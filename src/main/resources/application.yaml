spring:
  application:
    name: rent-flow-reservation
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
  datasource:
    hikari:
      connection-timeout: 1000
      validation-timeout: 500
  flyway:
    create-schemas: false
    default-schema: reservation
    schemas: reservation
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: reservation
  sql:
    init:
      mode: never
  http:
    serviceclient:
      inventory:
        base-url: ${INVENTORY_BASE_URL:http://inventory}
        connect-timeout: 500ms
        read-timeout: 1500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 30000
        delivery.timeout.ms: 45000
        max.block.ms: 5000

springdoc:
  paths-to-match: /api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.rentflow.service.rest.UnexpectedInventoryResponseException
  retry:
    instances:
      inventory:
        max-attempts: 5
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1600ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.2
        retry-exception-predicate: com.rentflow.service.rest.InventoryRetryableExceptionPredicate

reservation:
  creation:
    cleanup:
      cron: "0 0 3 * * *"
      runtime-budget: 60s
  cancellation:
    topic: ${RESERVATION_CANCELLATION_TOPIC:rentflow.reservation.cancelled.v1}
    max-payload-bytes: 4096
    relay:
      fixed-delay: 1s
      runtime-budget: 5s
      max-events-per-run: 100
      send-timeout: 50s
    retry:
      initial-backoff: 1s
      multiplier: 2
      max-backoff: 5m
      jitter: 0.2
    cleanup:
      cron: "0 30 3 * * *"
      runtime-budget: 60s
