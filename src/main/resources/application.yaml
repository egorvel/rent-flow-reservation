spring:
  main:
    banner-mode: "off"
  application:
    name: rent-flow-reservation
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true
      fail-on-ignored-properties: true
  datasource:
    hikari:
      connection-timeout: 1000
      validation-timeout: 500
  flyway:
    create-schemas: false
    default-schema: reservation
    schemas: reservation
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: reservation
  sql:
    init:
      mode: never
  http:
    serviceclient:
      inventory:
        base-url: ${INVENTORY_BASE_URL:http://inventory}
        connect-timeout: 500ms
        read-timeout: 1500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false
    template:
      observation-enabled: true
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        request.timeout.ms: 30000
        delivery.timeout.ms: 45000
        max.block.ms: 5000

springdoc:
  paths-to-match: /api/v1/**

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8087}
    address: ${MANAGEMENT_SERVER_ADDRESS:127.0.0.1}
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${OBSERVABILITY_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
        reservation.creation: true
        reservation.inventory.claim: true
        reservation.worker.run: true
      minimum-expected-value:
        http.server.requests: 1ms
        http.client.requests: 1ms
        reservation.creation: 1ms
        reservation.inventory.claim: 1ms
        reservation.worker.run: 1ms
      maximum-expected-value:
        http.server.requests: 30s
        http.client.requests: 30s
        reservation.creation: 30s
        reservation.inventory.claim: 30s
        reservation.worker.run: 120s
  tracing:
    propagation:
      type: w3c
    baggage:
      enabled: false
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${TRACING_EXPORT_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${OBSERVABILITY_ENVIRONMENT:local}
      service.instance.id: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    tracing:
      export:
        max-queue-size: 2048
        max-batch-size: 512
        otlp:
          transport: http
          endpoint: ${TRACING_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
          connect-timeout: 2s
          timeout: 2s
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

logging:
  level:
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.apache.kafka.clients.consumer.ConsumerConfig: WARN
    org.apache.kafka.clients.admin.AdminClientConfig: WARN
  structured:
    format:
      console: ecs
    ecs:
      service:
        environment: ${OBSERVABILITY_ENVIRONMENT:local}
        node-name: ${OBSERVABILITY_INSTANCE:${HOSTNAME:standalone}}
    json:
      stacktrace:
        max-length: 16384
        max-throwable-depth: 64

jdbc:
  includes: connection,query
  hikari:
    enabled: false
  resultset-operations:
    enabled: false
  datasource-proxy:
    include-parameter-values: false
    query:
      enable-logging: false
    slow-query:
      enable-logging: false

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
          - com.rentflow.service.rest.UnexpectedInventoryResponseException
  retry:
    instances:
      inventory:
        max-attempts: 5
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        exponential-max-wait-duration: 1600ms
        enable-randomized-wait: true
        randomized-wait-factor: 0.2
        retry-exception-predicate: com.rentflow.service.rest.InventoryRetryableExceptionPredicate

reservation:
  kafka:
    cluster-id: ${RESERVATION_KAFKA_CLUSTER_ID:}
  observability:
    operational-backlog-fixed-delay: 15s
    cleanup-backlog-fixed-delay: 60s
    query-timeout: 5s
  creation:
    cleanup:
      cron: "0 0 3 * * *"
      runtime-budget: 60s
  cancellation:
    topic: ${RESERVATION_CANCELLATION_TOPIC:rentflow.reservation.cancelled.v1}
    max-payload-bytes: 4096
    relay:
      enabled: true
      fixed-delay: 1s
      runtime-budget: 5s
      max-events-per-run: 100
      send-timeout: 50s
    retry:
      initial-backoff: 1s
      multiplier: 2
      max-backoff: 5m
      jitter: 0.2
    cleanup:
      enabled: true
      cron: "0 30 3 * * *"
      runtime-budget: 60s
    expiration:
      enabled: true
      hold-duration: 10m
      fixed-delay: 5s
      runtime-budget: 5s
      max-reservations-per-run: 100
