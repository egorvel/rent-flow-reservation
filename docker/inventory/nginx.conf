events {}

http {
    server {
        listen 8080;

        location = /api/v1/inventory/status {
            limit_except PATCH { deny all; }
            return 204;
        }

        location = /health {
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location / {
            return 404;
        }
    }
}
